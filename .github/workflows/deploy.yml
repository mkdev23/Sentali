name: Build Frontend + Deploy Backend to Azure

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout repo
    - name: Checkout
      uses: actions/checkout@v4

    # 2. Build frontend
    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    # 3. Setup .NET
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # 4. Login to Azure with OIDC
    - name: Login to Azure with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 5. Publish backend
    - name: Publish .NET app
      run: dotnet publish backend/SentaliApp.csproj -c Release -o ./publish

    # 6. Merge frontend into publish output (preserve backend assets)
    - name: Copy frontend to publish output
      run: |
        mkdir -p ./publish/wwwroot
        rsync -a frontend/dist/ ./publish/wwwroot/

    # 7. Deploy to Azure
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: sentali-app-6926
        package: ./publish
