name: Build Frontend + Deploy Backend to Azure

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Build frontend
    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    # Setup .NET
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # Login to Azure
    - name: Login to Azure with OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Publish backend
    - name: Publish .NET app
      run: dotnet publish backend/SentaliApp.csproj -c Release -o ./publish

    # Copy frontend into publish output
    - name: Copy frontend to publish output
      run: |
        rm -rf ./publish/wwwroot/*
        cp -r frontend/dist/* ./publish/wwwroot/

    # Deploy to Azure
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: sentali-app-6926
        package: ./publish

    # Verify asset exists
    - name: Verify frontend asset
      run: |
        HASHED_JS=$(grep -oP 'assets/index-[^"]+\.js' frontend/dist/index.html | head -n 1)
        curl -I "https://sentali-app-6926.azurewebsites.net/$HASHED_JS"
