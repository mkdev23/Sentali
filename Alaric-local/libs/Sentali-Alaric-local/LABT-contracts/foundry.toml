[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
extra_output = ["storageLayout", "metadata", "ir", "hashes"]
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[doc]
output = "docs"