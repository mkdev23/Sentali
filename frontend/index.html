<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sentali Local Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #c {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      font-family: sans-serif;
    }

    /* Control panel */
    #control-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.65);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 280px;
    }

    button {
      background: #1e88e5;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    button:hover { background: #1565c0; }

    #agent-ui {
      display: flex;
      gap: 6px;
    }

    #agentInput {
      flex: 1;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    #blendfacesToggle { margin-right: 4px; }
    label { color: white; font-size: 14px; }

    /* Chat log */
    #chat-log {
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 6px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      color: #ddd;
    }
    .chat-entry { margin-bottom: 4px; }
    .chat-user { color: #90caf9; }
    .chat-agent { color: #a5d6a7; }
  </style>
</head>
<body>
  <div id="control-panel">
    <button id="speakTestBtn">Test Speak</button>
    <button id="test">Local Test (aa)</button>
    <button id="unlockAudio">Enable Audio</button>

    <label>
      <input type="checkbox" id="blendfacesToggle" checked />
      Use Blendfaces
    </label>

    <div id="agent-ui">
      <input type="text" id="agentInput" placeholder="Ask Sentali..." />
      <button onclick="sendToAgent()">Send</button>
      <button id="micBtn" title="Speak to Sentali">🎤</button>
    </div>

    <div id="chat-log"></div>
  </div>

  <canvas id="c"></canvas>
  <script type="module" src="/src/main.js"></script>

  <script>
    async function sendToAgent() {
      const input = document.getElementById("agentInput").value.trim();
      if (!input) return;
      addChatEntry("user", input);
      document.getElementById("agentInput").value = "";

      const res = await fetch(`/api/tts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(input)
      });
      const json = await res.json();
      addChatEntry("agent", json.text || "[No response]");
    }

    function addChatEntry(role, text) {
      const log = document.getElementById("chat-log");
      const div = document.createElement("div");
      div.className = "chat-entry";
      div.innerHTML = `<span class="chat-${role}">${role}:</span> ${text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // Mic button speech-to-text
    document.getElementById("micBtn").addEventListener("click", () => {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Speech recognition not supported in this browser.");
        return;
      }
      const recognition = new webkitSpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("agentInput").value = transcript;
        sendToAgent();
      };
      recognition.start();
    });
  </script>
</body>
</html>
